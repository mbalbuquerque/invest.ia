{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Entrar | Invest.AI</title>

    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}"
    >
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <a href="{% url 'core:home' %}">
                Invest
            </a>

            <h1>Entrar</h1>

            <p>
                Acesse sua área de investimentos.
            </p>

            {% if form.errors %}
                <div class="auth-error">
                    Usuário ou senha inválidos.
                </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div>
                    <label for="{{ form.username.id_for_label }}">
                        Usuário
                    </label>

                    {{ form.username }}
                </div>

                <div>
                    <label for="{{ form.password.id_for_label }}">
                        Senha
                    </label>

                    {{ form.password }}
                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

            <p>
                Ainda não possui conta?

                <a href="{% url 'accounts:cadastro' %}">
                    Criar conta
                </a>
            </p>

        </section>

    </main>

</body>
</html>
