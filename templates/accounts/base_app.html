{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Invest.AI{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{% static 'css/styles.css' %}"
    >
</head>

<body class="app-body">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="app-header">

        <div class="app-header-inner">

            <!-- LOGO -->

            <a
                href="{% url 'dashboard' %}"
                class="app-brand"
            >
                Invest.AI
            </a>


            <!-- NAVEGAÇÃO -->

            <nav class="app-nav">

                <a href="{% url 'dashboard' %}">
                    Visão geral
                </a>

                <a href="{% url 'educacao:inicio' %}">
                    Educação Financeira
                </a>

                <a href="{% url 'perfil:resultado' %}">
                    Meu Perfil Financeiro
                </a>

                <a href="#">
                    Carteira
                </a>

                <a href="#">
                    Simuladores
                </a>

                <a href="#">
                    Radar
                </a>

                <a href="#">
                    Agente IA
                </a>

            </nav>


            <!-- USUÁRIO -->

            <div class="app-user">

                <span>
                    {{ request.user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'accounts:logout' %}"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="app-logout"
                    >
                        Sair
                    </button>

                </form>

            </div>

        </div>

    </header>


    <!-- =====================================================
         CONTEÚDO
         ===================================================== -->

    <main class="app-main">

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
